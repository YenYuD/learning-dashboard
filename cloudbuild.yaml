# Cloud Build pipeline for deploying to Cloud Run
#
# Prerequisites (one-time setup):
#   1. Enable APIs:
#      gcloud services enable cloudbuild.googleapis.com run.googleapis.com artifactregistry.googleapis.com secretmanager.googleapis.com
#
#   2. Create Artifact Registry repository:
#      gcloud artifacts repositories create learning-dashboard --repository-format=docker --location=asia-east1
#
#   3. Create secrets in Secret Manager:
#      echo -n "postgresql://..." | gcloud secrets create DATABASE_URL --data-file=-
#      echo -n "your-secret-key" | gcloud secrets create NEXTAUTH_SECRET --data-file=-
#      echo -n "your-google-client-id" | gcloud secrets create GOOGLE_CLIENT_ID --data-file=-
#      echo -n "your-google-client-secret" | gcloud secrets create GOOGLE_CLIENT_SECRET --data-file=-
#      echo -n "your-github-client-id" | gcloud secrets create GITHUB_CLIENT_ID --data-file=-
#      echo -n "your-github-client-secret" | gcloud secrets create GITHUB_CLIENT_SECRET --data-file=-
#      echo -n "https://xxx@sentry.io/..." | gcloud secrets create SENTRY_DSN --data-file=-
#      echo -n "your-org-slug" | gcloud secrets create SENTRY_ORG --data-file=-
#      echo -n "your-project-slug" | gcloud secrets create SENTRY_PROJECT --data-file=-
#      echo -n "https://xxx.upstash.io" | gcloud secrets create UPSTASH_REDIS_REST_URL --data-file=-
#      echo -n "your-token" | gcloud secrets create UPSTASH_REDIS_REST_TOKEN --data-file=-
#
#   4. Grant Cloud Build service account permissions:
#      PROJECT_NUMBER=$(gcloud projects describe learning-dashboard-2026 --format='value(projectNumber)')
#      gcloud projects add-iam-policy-binding learning-dashboard-2026 \
#        --member="serviceAccount:${PROJECT_NUMBER}@cloudbuild.gserviceaccount.com" \
#        --role="roles/run.admin"
#      gcloud projects add-iam-policy-binding learning-dashboard-2026 \
#        --member="serviceAccount:${PROJECT_NUMBER}@cloudbuild.gserviceaccount.com" \
#        --role="roles/iam.serviceAccountUser"
#      gcloud projects add-iam-policy-binding learning-dashboard-2026 \
#        --member="serviceAccount:${PROJECT_NUMBER}@cloudbuild.gserviceaccount.com" \
#        --role="roles/secretmanager.secretAccessor"

substitutions:
  _REGION: asia-east1
  _SERVICE_NAME: learning-dashboard-2026
  _REPO_NAME: learning-dashboard-2026
  _IMAGE_TAG: latest

steps:
  # Step 1: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:${_IMAGE_TAG}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:latest'
      - '--build-arg'
      - 'NEXT_PUBLIC_SITE_URL=${_NEXT_PUBLIC_SITE_URL}'
      - '--build-arg'
      - 'NEXT_PUBLIC_VAPID_PUBLIC_KEY=${_NEXT_PUBLIC_VAPID_PUBLIC_KEY}'
      - '.'
    env:
      - 'DOCKER_BUILDKIT=1'

  # Step 2: Push Docker image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - |
        SECRETS=(
          "DATABASE_URL=DATABASE_URL:latest"
          "NEXTAUTH_SECRET=NEXTAUTH_SECRET:latest"
          "GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest"
          "GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest"
          "GITHUB_CLIENT_ID=GITHUB_CLIENT_ID:latest"
          "GITHUB_CLIENT_SECRET=GITHUB_CLIENT_SECRET:latest"
          "VAPID_PUBLIC_KEY=VAPID_PUBLIC_KEY:latest"
          "VAPID_PRIVATE_KEY=VAPID_PRIVATE_KEY:latest"
          "VAPID_EMAIL=VAPID_EMAIL:latest"
          "SENTRY_DSN=SENTRY_DSN:latest"
          "SENTRY_ORG=SENTRY_ORG:latest"
          "SENTRY_PROJECT=SENTRY_PROJECT:latest"
          "UPSTASH_REDIS_REST_URL=UPSTASH_REDIS_REST_URL:latest"
          "UPSTASH_REDIS_REST_TOKEN=UPSTASH_REDIS_REST_TOKEN:latest"
        )
        gcloud run deploy ${_SERVICE_NAME} \
          --image ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:${_IMAGE_TAG} \
          --region ${_REGION} \
          --platform managed \
          --port 3000 \
          --allow-unauthenticated \
          --set-secrets "$$(IFS=,; echo "$${SECRETS[*]}")" \
          --set-env-vars "NODE_ENV=production,NEXTAUTH_URL=https://${_SERVICE_NAME}-${PROJECT_NUMBER}.${_REGION}.run.app,NEXT_PUBLIC_SITE_URL=${_NEXT_PUBLIC_SITE_URL}"

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:${_IMAGE_TAG}'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:latest'

options:
  logging: CLOUD_LOGGING_ONLY
